name: Kiln on Android (emulator)

# Boots an Android 14 emulator (same Android as LineageOS 21) at the Fire HD 8's screen size,
# installs Kiln, and checks the app, its built-in server and the 3D viewer. Screenshots go to the
# "kiln-screens" branch.
on:
  push:
    branches: [main]
    paths: ["kiln/**", ".github/workflows/kiln-emulator.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build Kiln (release and debug)
        run: |
          kiln/sync-web.sh
          chmod +x gradlew
          ./gradlew --no-daemon :kiln:assembleRelease :kiln:assembleDebug
      - name: Test tools
        run: npm install --no-save --no-audit --no-fund playwright@1.48.2
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p screens; adb shell wm size 1280x800; adb shell wm density 189; adb logcat -c
            adb install -r kiln/build/outputs/apk/release/kiln-release.apk
            adb shell am start -W -n io.github.jayswansocool48.kiln/.MainActivity; sleep 15
            adb exec-out screencap -p > screens/01-release-start.png
            adb shell pidof io.github.jayswansocool48.kiln > /dev/null && echo "release: running" > screens/release.txt || echo "release: NOT RUNNING" > screens/release.txt
            adb logcat -d | grep -E "FATAL|AndroidRuntime|chromium.*(Uncaught|Error)" | head -40 >> screens/release.txt || true
            adb uninstall io.github.jayswansocool48.kiln
            adb install -r kiln/build/outputs/apk/debug/kiln-debug.apk
            adb shell am start -W -n io.github.jayswansocool48.kiln/.MainActivity; sleep 12
            OUT=screens node kiln/tests/smoke.mjs > screens/smoke.log 2>&1 || touch screens/FAILED; cat screens/smoke.log
            adb exec-out screencap -p > screens/02-viewer-extrude.png
            adb shell input keyevent KEYCODE_BACK; sleep 2; adb exec-out screencap -p > screens/03-after-back.png
            adb logcat -d | grep -E "FATAL|AndroidRuntime" | head -40 > screens/logcat.txt || true
      - name: Publish screenshots
        if: always()
        run: |
          cat screens/release.txt screens/RESULTS.txt 2>/dev/null || true
          cd screens && git init -q && git checkout -q -b kiln-screens && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Kiln emulator run ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" kiln-screens
      - name: Result
        run: |
          grep -q "release: running" screens/release.txt || { echo "::error::Release APK didn't stay running"; exit 1; }
          [ ! -f screens/FAILED ] || { echo "::error::$(tail -5 screens/smoke.log | tr '\n' ' ')"; exit 1; }
