name: Build apps

# Builds every app in this repo. APKs are committed to the repo root;
# the Deskmate desktop companion goes to the "deskmate-desktop" release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.apk"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Deskmate for Linux and Windows
        working-directory: deskmate-desktop
        run: |
          go vet ./...
          mkdir -p dist
          build() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath -ldflags="-s -w" -o "dist/$3" . ; }
          build linux amd64 deskmate-linux-x86_64
          build linux arm64 deskmate-linux-arm64
          build windows amd64 deskmate-windows-x64.exe
          build windows arm64 deskmate-windows-arm64.exe
          chmod +x dist/deskmate-linux-*
          VERSION=$(grep -oP 'appVersion = "\K[^"]+' main.go)
          packaging/linux/build-deb.sh dist/deskmate-linux-x86_64 amd64 "$VERSION" dist
          packaging/linux/build-deb.sh dist/deskmate-linux-arm64 arm64 "$VERSION" dist
          ls -la dist

      - name: Publish to the deskmate-desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view deskmate-desktop >/dev/null 2>&1 || gh release create deskmate-desktop \
            --title "Deskmate desktop companion" \
            --notes "Pop!_OS / Ubuntu / Debian / Mint: download deskmate_*_amd64.deb and double-click it to install, then open Deskmate from your apps. Other Linux: deskmate-linux-x86_64. Windows: deskmate-windows-x64.exe."
          gh release upload deskmate-desktop deskmate-desktop/dist/* --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get llama.cpp for Codeling's tablet AI
        run: |
          VERSION=$(cat codeling/src/main/cpp/LLAMA_CPP_VERSION)
          git clone --depth 1 --branch "$VERSION" https://github.com/ggml-org/llama.cpp codeling/src/main/cpp/llama.cpp

      - name: Prepare Codeling's web app for older WebViews
        run: |
          npm install --prefix tools --no-audit --no-fund
          node tools/prepare-web.mjs codeling/web-src codeling/web-dist

      - name: Add three.js to Kiln's web app
        run: kiln/sync-web.sh

      - name: Build release APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :inkwell:assembleRelease :codeling:assembleRelease :deskmate:assembleRelease :gamecodex:assembleRelease :kiln:assembleRelease 2>&1 | tee build.log
          cp inkwell/build/outputs/apk/release/inkwell-release.apk Inkwell.apk
          cp codeling/build/outputs/apk/release/codeling-release.apk Codeling.apk
          cp deskmate/build/outputs/apk/release/deskmate-release.apk Deskmate.apk
          cp gamecodex/build/outputs/apk/release/gamecodex-release.apk GameCodex.apk
          # What Game Codex's in-app update check reads.
          code=$(grep -oP 'versionCode = \K[0-9]+' gamecodex/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' gamecodex/build.gradle.kts)
          printf '{"versionCode": %s, "versionName": "%s", "apk": "https://raw.githubusercontent.com/%s/main/GameCodex.apk"}\n' "$code" "$name" "$GITHUB_REPOSITORY" > GameCodex.json
          cat GameCodex.json
          cp kiln/build/outputs/apk/release/kiln-release.apk Kiln.apk
          ls -la *.apk

      - name: Show why the build failed
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          { grep -E "error:|e: |FAILED|What went wrong|Caused by|Killed|OutOfMemory" -A2 build.log | grep -v "^--$" | head -30; echo "---- last lines ----"; tail -n 30 build.log; } | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Commit the new APKs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add Inkwell.apk Codeling.apk Deskmate.apk GameCodex.apk GameCodex.json Kiln.apk
          git diff --cached --quiet && exit 0
          git commit -m "Update APKs [skip ci]"
          git pull --rebase origin main
          git push
