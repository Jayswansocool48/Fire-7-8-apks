name: Hub Remote on Android (emulator)

# Runs the real Hub server (with a fake Roku TV) on the runner, then boots Android 14 at the
# Fire HD 8's screen size and Android 7.1 at the Fire 7's, installs Hub Remote, opens every
# tab and swipes the remote pad. Screenshots go to the "hub-remote-screens" branch.
on:
  push:
    branches: [main]
    paths: ["hub-remote/**", "hub-server/**", ".github/workflows/hub-remote-emulator.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fire-hd-8
            api: 34
            arch: x86_64
            size: 1280x800
            skin: 1280x800
            density: 189
            padx: 420
            pady: 460
          - name: fire-7
            api: 25
            arch: x86
            size: 1024x600
            skin: 1024x600
            density: 170
            padx: 340
            pady: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build Hub Remote
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :hub-remote:assembleRelease
      - name: Start a fake Roku TV and the Hub server
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          mkdir -p hubdata media/Gallery/Trip media/Media/Movies
          python3 -c "import zlib,struct
          def png(c,w=640,h=400):
              raw=b''.join(b'\x00'+bytes(c)*w for _ in range(h))
              ch=lambda t,d: struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              return b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b'')
          for i,c in enumerate([(200,80,60),(60,140,220),(80,200,120)]): open(f'media/Gallery/Trip/photo{i}.png','wb').write(png(c))"
          head -c 300000 /dev/urandom > media/Media/Movies/movie.mp4
          echo "{\"tv_ip\":\"127.0.0.1\",\"media\":[{\"name\":\"Gallery\",\"path\":\"$PWD/media/Gallery\"},{\"name\":\"Media\",\"path\":\"$PWD/media/Media\"}],\"notes\":[{\"id\":\"n1\",\"text\":\"Pizza at 7\",\"color\":\"#FFD166\",\"created\":0}]}" > hubdata/config.json
          nohup python3 hub-remote/tests/fake_roku.py roku-keys.log > roku.out 2>&1 &
          nohup python3 hub-server/hub_server.py --config hubdata/config.json > hub.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8765/api/status > /dev/null && break; sleep 1; done
          curl -s localhost:8765/api/status | head -c 300; echo
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.arch }}
          disable-animations: true
          emulator-options: -skin ${{ matrix.skin }} -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: OUT=screens/${{ matrix.name }} bash hub-remote/tests/emulator.sh hub-remote/build/outputs/apk/release/hub-remote-release.apk ${{ matrix.size }} ${{ matrix.density }} ${{ matrix.padx }} ${{ matrix.pady }}
      - name: Collect results
        if: always()
        run: |
          mkdir -p screens/${{ matrix.name }}
          cp roku-keys.log hub.log screens/${{ matrix.name }}/ 2>/dev/null || true
          cd screens/${{ matrix.name }}
          { echo "== keys the TV received"; cat roku-keys.log 2>/dev/null; echo "== app"; cat results.txt crashes.txt 2>/dev/null; } | tee summary.txt
      - name: Publish screenshots
        if: always()
        run: |
          git fetch -q origin hub-remote-screens:hub-remote-screens 2>/dev/null || true
          mkdir -p pub && cd pub && git init -q && git checkout -q -b hub-remote-screens
          git pull -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hub-remote-screens 2>/dev/null || true
          rm -rf ${{ matrix.name }} && cp -r ../screens/${{ matrix.name }} . && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Hub Remote emulator run ${{ matrix.name }} ${{ github.sha }}" || true
          for i in 1 2 3; do git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hub-remote-screens && break; git pull -q --rebase "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hub-remote-screens || true; done
      - name: Result
        run: |
          S=screens/${{ matrix.name }}
          ! grep -q "NOT RUNNING" $S/results.txt || { echo "::error::Hub Remote crashed: $(head -5 $S/crashes.txt | tr '\n' ' ')"; exit 1; }
          grep -q "keypress/Right" $S/roku-keys.log || { echo "::error::Swiping right on the pad didn't reach the TV"; exit 1; }
          grep -q "keypress/Select" $S/roku-keys.log || { echo "::error::Tapping the pad didn't send OK to the TV"; exit 1; }
