<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1218"/>
      <stop offset="1" stop-color="#100709"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c86"/>
      <stop offset="1" stop-color="#c41a5c"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="60" fill="url(#tile)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="59.5" fill="none" stroke="#ff4d7a" stroke-opacity=".22"/>
  <!-- an open codex: two pages meeting at the spine -->
  <path d="M128 78c-18-12-44-16-70-13v104c26-3 52 1 70 13z" fill="url(#page)"/>
  <path d="M128 78c18-12 44-16 70-13v104c-26-3-52 1-70 13z" fill="#f7eef1"/>
