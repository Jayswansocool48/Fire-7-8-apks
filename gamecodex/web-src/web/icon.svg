    <path d="M74 98h36M74 118h28M74 138h34"/>
  </g>
  <!-- a game controller on the right page -->
  <path d="M146 112c0-7 5-11 12-11h22c7 0 12 4 12 11l3 22c1 8-8 12-13 6l-6-7h-16l-6 7c-5 6-14 2-13-6z" fill="#8a1236"/>
  <path d="M157 114v10M152 119h10" stroke="#f7eef1" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="179" cy="116" r="3.2" fill="#ff4d7a"/><circle cx="185" cy="123" r="3.2" fill="#ff4d7a"/>
</svg>
